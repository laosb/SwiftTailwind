name: Release TailwindCSS CLI Artifacts

on:
  workflow_dispatch:
    inputs:
      tailwind_version:
        description: "TailwindCSS release version (e.g., v4.1.14)"
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and Release Artifacts
    runs-on: ubuntu-26.04
    container:
      image: swift:6.3
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install artifact bundler dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zip

      - name: Compute package resolution checksum
        id: package-resolution
        run: |
          checksum=$(sha256sum Package.resolved | awk '{print $1}')
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ steps.package-resolution.outputs.checksum }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      - name: Validate version format
        shell: bash
        run: |
          if [[ ! "${{ inputs.tailwind_version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format vX.Y.Z (e.g., v4.1.14)"
            exit 1
          fi
          echo "Version format is valid: ${{ inputs.tailwind_version }}"

      - name: Build artifact bundler
        run: |
          echo "Building TailwindCSSCLIArtifactBundler..."
          swift build -c release --product TailwindCSSCLIArtifactBundler

      - name: Create artifact bundles
        run: |
          echo "Creating artifact bundles for TailwindCSS ${{ inputs.tailwind_version }}..."
          mkdir -p ./artifacts
          .build/release/TailwindCSSCLIArtifactBundler \
            --version "${{ inputs.tailwind_version }}" \
            --work-dir "${{ runner.temp }}/tailwindcss-bundles" \
            --output-dir ./artifacts

      - name: List generated artifacts
        run: |
          echo "Generated artifacts:"
          ls -lh artifacts/

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum artifacts/tailwindcss.artifactbundleindex | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Artifact bundle index checksum: $CHECKSUM"

      - name: Create release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: TailwindCSSCLI-${{ inputs.tailwind_version }}-${{ steps.checksum.outputs.checksum }}
          name: TailwindCSS CLI ${{ inputs.tailwind_version }}
          body: |
            ## TailwindCSS CLI Artifact Bundles

            This release contains Swift Package Manager artifact bundles for TailwindCSS CLI version `${{ inputs.tailwind_version }}`.

            ### Included Artifacts
            - Linux x64 (`x86_64-unknown-linux-gnu`)
            - Linux ARM64 (`aarch64-unknown-linux-gnu`)
            - macOS x64 (`x86_64-apple-darwin`)
            - macOS ARM64 (`aarch64-apple-darwin`)

            ### Binary Target Definition
            ```swift
            .binaryTarget(
              name: "TailwindCSSCLI",
              url: "https://github.com/${{ github.repository }}/releases/download/TailwindCSSCLI-${{ inputs.tailwind_version }}-${{ steps.checksum.outputs.checksum }}/tailwindcss.artifactbundleindex",
              checksum: "${{ steps.checksum.outputs.checksum }}"
            )
            ```
          draft: false
          prerelease: false
          make_latest: false
          files: |
            artifacts/*.zip
            artifacts/tailwindcss.artifactbundleindex

      - name: Update Package.swift
        shell: bash
        run: |
          artifact_tag="TailwindCSSCLI-${{ inputs.tailwind_version }}-${{ steps.checksum.outputs.checksum }}"
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${artifact_tag}/tailwindcss.artifactbundleindex"
          artifact_checksum="${{ steps.checksum.outputs.checksum }}"

          sed --in-place --regexp-extended \
            's#url: "https://github.com/[^\"]+/[^\"]+/releases/download/TailwindCSSCLI-[^\"]+/tailwindcss\.artifactbundleindex"#url: "'"${artifact_url}"'"#' \
            Package.swift
          sed --in-place --regexp-extended \
            's#checksum: "[0-9a-f]{64}"#checksum: "'"${artifact_checksum}"'"#' \
            Package.swift

          grep --fixed-strings --quiet "url: \"${artifact_url}\"" Package.swift
          grep --fixed-strings --quiet "checksum: \"${artifact_checksum}\"" Package.swift

      - name: Commit Package.swift update
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if git diff --quiet -- Package.swift; then
            echo "Package.swift already references this artifact bundle."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit --message "Update TailwindCSS CLI to ${{ inputs.tailwind_version }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
